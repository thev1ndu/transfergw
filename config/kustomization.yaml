apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gateway-system

commonLabels:
  app.kubernetes.io/name: transfergw
  app.kubernetes.io/version: v1beta1

commonAnnotations:
  description: "Gateway Migration Operator for Kubernetes"

bases:
  - crd/
  - rbac/
  - manager/

resources: []

patchesStrategicMerge: []

# Vars can be used to parametrize the templates
vars:
  - name: CONTROLLER_IMG
    objref:
      kind: Deployment
      name: transfergw-controller
      apiVersion: apps/v1
    fieldref:
      fieldpath: spec.template.spec.containers[0].image
  - name: NAMESPACE
    objref:
      kind: Namespace
      name: gateway-system
      apiVersion: v1
    fieldref:
      fieldpath: metadata.name
