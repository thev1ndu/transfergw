---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-transfergw-t-1-dev-v1beta1-transfergw
  failurePolicy: Fail
  name: vtransfergw.kb.io
  rules:
  - apiGroups:
    - transfergw.t-1.dev
    apiVersions:
    - v1beta1
    operations:
    - CREATE
    - UPDATE
    resources:
    - transfergws
  sideEffects: None
