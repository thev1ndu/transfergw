name: Unit and Integration Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Run unit tests
        run: make test

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: ./cover.out
          flags: unittests
          name: codecov-umbrella

      - name: Run lint
        if: always()
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned: the action's default resolves to a v1.x build compiled with
          # Go 1.24, which refuses a go.mod targeting 1.26.
          version: v2.13.2

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Run integration tests
        run: make test-integration
