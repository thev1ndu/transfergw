name: Publish Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'chart/**'
      - '.github/workflows/helm-publish.yaml'
  workflow_run:
    workflows: ["Build and Push Image"]
    branches: [main]
    types:
      - completed

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: 'latest'

      - name: Lint Helm chart
        run: helm lint chart/transfergw

      - name: Create chart package
        run: |
          mkdir -p helm-releases
          helm package chart/transfergw -d helm-releases

      - name: Login to GHCR
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push chart to GHCR
        run: |
          for chart in helm-releases/*.tgz; do
            helm push "$chart" oci://ghcr.io/${{ github.repository_owner }}/helm-charts
          done

      - name: Update Helm chart repo index
        run: |
          mkdir -p gh-pages
          cp helm-releases/*.tgz gh-pages/
          cp chart/transfergw/artifacthub-repo.yml gh-pages/
          cd gh-pages
          if curl -fsSL -o index.yaml https://thev1ndu.github.io/transfergw/index.yaml; then
            helm repo index . --url https://thev1ndu.github.io/transfergw/ --merge index.yaml
          else
            helm repo index . --url https://thev1ndu.github.io/transfergw/
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages
