{{- if and .Values.enableWebhooks .Values.webhookCABundle }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: transfergw-validating-webhook
webhooks:
  - name: vtransfergw.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      caBundle: {{ .Values.webhookCABundle }}
      service:
        name: transfergw-webhook-service
        namespace: {{ .Values.namespace }}
        path: /validate-transfergw-t-1-dev-v1beta1-transfergw
    rules:
      - apiGroups: ["transfergw.t-1.dev"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["transfergws"]
{{- end }}
