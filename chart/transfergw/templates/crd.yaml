{{- if .Values.crd.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: transfergws.transfergw.t-1.dev
spec:
  group: transfergw.t-1.dev
  names:
    kind: TransferGW
    listKind: TransferGWList
    plural: transfergws
    shortNames:
    - tgw
    singular: transfergw
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.completionPercentage
      name: Progress
      type: integer
    - jsonPath: .status.trafficRouting.ingress
      name: Ingress
      type: integer
    - jsonPath: .status.trafficRouting.gateway
      name: Gateway
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: TransferGW is the Schema for the transfergws API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TransferGWSpec defines the desired state of TransferGW
            properties:
              conversion:
                description: Conversion specifies how to translate Ingress to Gateway
                  API
                properties:
                  annotationPolicy:
                    description: AnnotationPolicy specifies how to handle ingress
                      annotations
                    properties:
                      drop:
                        description: Drop is a list of regex patterns of annotations
                          to remove
                        items:
                          type: string
                        type: array
                      preserve:
                        description: Preserve is a list of regex patterns of annotations
                          to preserve
                        items:
                          type: string
                        type: array
                      translate:
                        additionalProperties:
                          type: string
                        description: Translate maps old annotation names to new policy
                          names
                        type: object
                    type: object
                  gatewayClass:
                    description: GatewayClass is the target gateway class
                    minLength: 1
                    type: string
                  gatewayName:
                    description: |-
                      GatewayName overrides the name of the Gateway HTTPRoutes attach to.
                      Defaults to "<TransferGW name>-gateway", a Gateway this migration owns.
                      Set this to attach to an existing, independently managed Gateway
                      instead (typically combined with generateGateway: false, since
                      TransferGW should not take ownership of a Gateway it didn't create).
                    type: string
                  generateGateway:
                    description: GenerateGateway auto-creates Gateway resource if
                      missing
                    type: boolean
                  targetNamespace:
                    description: TargetNamespace is where Gateway resources are created
                    type: string
                  tlsHandling:
                    description: TLSHandling specifies how to handle TLS certificates
                    enum:
                    - preserve
                    - regenerate
                    - manual
                    type: string
                  validationMode:
                    description: ValidationMode specifies validation strictness
                    enum:
                    - strict
                    - permissive
                    - disabled
                    type: string
                required:
                - gatewayClass
                type: object
              lifecycle:
                description: Lifecycle specifies cleanup and validation behavior
                properties:
                  autoComplete:
                    description: AutoComplete marks complete when reaching 100%
                    type: boolean
                  backupOriginal:
                    description: BackupOriginal keeps backup of original configuration
                    type: boolean
                  cleanupOnSuccess:
                    description: CleanupOnSuccess deletes original ingress after migration
                    type: boolean
                  hooks:
                    description: Hooks specifies pre/post migration webhooks
                    properties:
                      postConversion:
                        description: PostConversion runs after conversion
                        properties:
                          url:
                            description: Url is the webhook URL
                            type: string
                        required:
                        - url
                        type: object
                      postRollout:
                        description: PostRollout runs after rollout complete
                        properties:
                          url:
                            description: Url is the webhook URL
                            type: string
                        required:
                        - url
                        type: object
                      preConversion:
                        description: PreConversion runs before conversion
                        properties:
                          url:
                            description: Url is the webhook URL
                            type: string
                        required:
                        - url
                        type: object
                      preRollout:
                        description: PreRollout runs before rollout
                        properties:
                          url:
                            description: Url is the webhook URL
                            type: string
                        required:
                        - url
                        type: object
                    type: object
                  pauseOriginalIngress:
                    description: PauseOriginalIngress pauses original ingress during
                      rollout
                    type: boolean
                  validateConversion:
                    description: ValidateConversion rejects if conversion has warnings
                    type: boolean
                type: object
              monitoring:
                description: Monitoring specifies health checks and rollback thresholds
                properties:
                  alerting:
                    description: Alerting specifies alerting configuration
                    properties:
                      enabled:
                        description: Enabled enables alerting
                        type: boolean
                      slackChannel:
                        description: SlackChannel is the optional Slack channel
                        type: string
                      webhookUrl:
                        description: WebhookUrl is the optional webhook URL for alerts
                        type: string
                    type: object
                  comparisonWindow:
                    description: ComparisonWindow is the evaluation window for metrics
                    type: string
                  enabled:
                    description: Enabled enables health checks
                    type: boolean
                  interval:
                    description: Interval is the health check interval
                    type: string
                  metrics:
                    description: Metrics specifies which metrics to collect
                    items:
                      type: string
                    type: array
                  thresholds:
                    description: Thresholds specifies rollback thresholds
                    properties:
                      connectionResets:
                        description: ConnectionResets is the connection resets threshold
                        type: number
                      errorRate:
                        description: ErrorRate is the error rate threshold
                        maximum: 1
                        minimum: 0
                        type: number
                      latencyMs:
                        description: LatencyMs is the latency threshold in milliseconds
                        format: int32
                        type: integer
                      latencyPercentile:
                        description: LatencyPercentile is the latency percentile
                        enum:
                        - p50
                        - p75
                        - p90
                        - p95
                        - p99
                        type: string
                      throughputDelta:
                        description: ThroughputDelta is the throughput delta percentage
                          threshold
                        type: number
                    type: object
                type: object
              rollout:
                description: Rollout specifies the migration rollout strategy
                properties:
                  approvedPercentage:
                    description: |-
                      ApprovedPercentage is the traffic percentage a human has signed off on.
                      Only consulted when RequireApproval is true: the rollout never exceeds
                      this value even if immediate/gradual/canary would otherwise set a
                      higher one. Bump this (e.g. to match status.pendingPlan.nextPercentage)
                      to let the rollout advance.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  canary:
                    description: Canary specifies canary-specific rollout settings
                    properties:
                      increment:
                        description: Increment is the traffic percentage increase
                          per step
                        format: int32
                        maximum: 100
                        minimum: 1
                        type: integer
                      initialPercentage:
                        description: InitialPercentage is the initial traffic percentage
                        format: int32
                        maximum: 100
                        minimum: 0
                        type: integer
                      maxDuration:
                        description: MaxDuration is the maximum total canary duration
                        type: string
                      stepDuration:
                        description: StepDuration is the duration between increment
                          steps
                        type: string
                    type: object
                  gradual:
                    description: Gradual specifies gradual rollout settings
                    properties:
                      step:
                        description: Step is the percentage step size
                        format: int32
                        type: integer
                      totalDuration:
                        description: TotalDuration is the total time to reach 100%
                        type: string
                    type: object
                  mode:
                    description: Mode is the rollout mode
                    enum:
                    - immediate
                    - gradual
                    - canary
                    type: string
                  paused:
                    description: Paused pauses the rollout without deletion
                    type: boolean
                  requireApproval:
                    description: |-
                      RequireApproval holds the rollout at ApprovedPercentage instead of
                      advancing on the schedule's own timing. The schedule's intended next
                      step is still computed every reconcile and published on
                      status.pendingPlan, so it can be reviewed before it takes effect.
                    type: boolean
                  strategy:
                    description: Strategy is the rollout strategy
                    enum:
                    - percentage
                    - time-based
                    - manual
                    type: string
                required:
                - mode
                type: object
              selector:
                description: Selector specifies which Ingress resources to migrate
                properties:
                  ingressClasses:
                    description: IngressClasses specifies specific ingress classes
                      to migrate
                    items:
                      type: string
                    type: array
                  ingressSelector:
                    description: IngressSelector is a label selector for Ingress resources
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  namespaces:
                    description: Namespaces is a list of namespace patterns (glob
                      supported)
                    items:
                      type: string
                    type: array
                type: object
            required:
            - conversion
            - rollout
            - selector
            type: object
          status:
            description: TransferGWStatus defines the observed state of TransferGW
            properties:
              completionPercentage:
                description: CompletionPercentage is the traffic percentage on gateway
                format: int32
                maximum: 100
                minimum: 0
                type: integer
              conditions:
                description: Conditions is a list of conditions
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              issues:
                description: Issues shows conversion warnings
                items:
                  description: ConversionIssue represents a conversion warning or
                    error
                  properties:
                    ingress:
                      type: string
                    issue:
                      type: string
                    recommendation:
                      type: string
                    severity:
                      type: string
                  type: object
                maxItems: 100
                type: array
              lastHealthCheck:
                description: LastHealthCheck is the last health check time
                format: date-time
                type: string
              lastTransitionTime:
                description: LastTransitionTime is the last status transition time
                format: date-time
                type: string
              metrics:
                description: Metrics shows comparison metrics
                properties:
                  errorRate:
                    description: MetricComparison shows metric comparison between
                      ingress and gateway
                    properties:
                      delta:
                        type: string
                      gateway:
                        type: string
                      ingress:
                        type: string
                      status:
                        type: string
                    type: object
                  latency:
                    description: MetricComparison shows metric comparison between
                      ingress and gateway
                    properties:
                      delta:
                        type: string
                      gateway:
                        type: string
                      ingress:
                        type: string
                      status:
                        type: string
                    type: object
                  throughput:
                    description: MetricComparison shows metric comparison between
                      ingress and gateway
                    properties:
                      delta:
                        type: string
                      gateway:
                        type: string
                      ingress:
                        type: string
                      status:
                        type: string
                    type: object
                type: object
              nextHealthCheck:
                description: NextHealthCheck is the next scheduled health check
                format: date-time
                type: string
              pendingPlan:
                description: |-
                  PendingPlan previews the rollout schedule's next step and records this
                  reconcile's route changes. Only populated when spec.rollout.requireApproval
                  is set - a migration that doesn't use approval gating advances on its own,
                  so there is nothing pending to show.
                properties:
                  currentPercentage:
                    description: |-
                      CurrentPercentage is what's actually live right now - the same value
                      as status.completionPercentage, repeated here for a single-glance diff
                      against NextPercentage.
                    format: int32
                    type: integer
                  nextPercentage:
                    description: |-
                      NextPercentage is what the rollout schedule would set the Gateway's
                      traffic share to on the next reconcile, ignoring RequireApproval.
                    format: int32
                    type: integer
                  routeChanges:
                    description: |-
                      RouteChanges lists the HTTPRoute/GRPCRoute adds, updates and removals
                      this reconcile made to keep the generated routes in sync with the
                      selected Ingresses. These always apply regardless of RequireApproval:
                      only the traffic percentage above is gated, since a Gateway API route
                      existing does not by itself move client traffic - see rolloutPercentage
                      in the controller.
                    items:
                      description: |-
                        RouteChange records one HTTPRoute/GRPCRoute add, update or removal made
                        while reconciling a TransferGW.
                      properties:
                        action:
                          description: Action is add, modify or remove.
                          enum:
                          - add
                          - modify
                          - remove
                          type: string
                        detail:
                          description: Detail optionally explains the change.
                          type: string
                        route:
                          description: Route is the namespace/name of the affected
                            HTTPRoute or GRPCRoute.
                          type: string
                      required:
                      - action
                      - route
                      type: object
                    maxItems: 100
                    type: array
                type: object
              phase:
                description: Phase is the current migration phase
                enum:
                - Pending
                - Analyzing
                - Converting
                - Deploying
                - Canary
                - Complete
                - Failed
                - RolledBack
                type: string
              processed:
                description: Processed shows conversion statistics
                properties:
                  converted:
                    format: int32
                    type: integer
                  failed:
                    format: int32
                    type: integer
                  pending:
                    format: int32
                    type: integer
                  total:
                    format: int32
                    type: integer
                type: object
              resources:
                description: Resources shows created gateway resources
                properties:
                  backendPolicies:
                    format: int32
                    type: integer
                  gateways:
                    format: int32
                    type: integer
                  httpRoutes:
                    format: int32
                    type: integer
                  tlsPolicies:
                    format: int32
                    type: integer
                type: object
              rollbackGeneration:
                description: |-
                  RollbackGeneration is the spec generation that was rolled back. While it
                  matches metadata.generation the rollout stays held, so an operator has to
                  edit the spec before the canary is retried.
                format: int64
                type: integer
              rollbackReady:
                description: RollbackReady indicates if rollback is ready
                type: boolean
              trafficRouting:
                description: TrafficRouting shows current traffic distribution
                properties:
                  gateway:
                    format: int32
                    type: integer
                  ingress:
                    format: int32
                    type: integer
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
