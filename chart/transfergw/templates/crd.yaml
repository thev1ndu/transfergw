{{- if .Values.crd.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: transfergws.transfergw.t-1.dev
  annotations:
    controller-gen.kubebuilder.io/version: v0.11.1
spec:
  group: transfergw.t-1.dev
  names:
    kind: TransferGW
    listKind: TransferGWList
    plural: transfergws
    shortNames:
      - tgw
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: TransferGW manages ingress to gateway API migration lifecycle
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - selector
                - conversion
                - rollout
              properties:
                selector:
                  type: object
                  description: Selects which Ingress resources to migrate
                  properties:
                    namespaces:
                      type: array
                      items:
                        type: string
                      description: Namespace patterns to include (supports wildcards)
                    ingressSelector:
                      type: object
                      description: Label selector for Ingress resources
                      properties:
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
                        matchExpressions:
                          type: array
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                              operator:
                                type: string
                              values:
                                type: array
                                items:
                                  type: string
                    ingressClasses:
                      type: array
                      items:
                        type: string
                      description: Specific ingress classes to migrate
                conversion:
                  type: object
                  description: Configuration for ingress to gateway conversion
                  required:
                    - gatewayClass
                  properties:
                    gatewayClass:
                      type: string
                      description: Target GatewayClass
                      minLength: 1
                    targetNamespace:
                      type: string
                      description: Namespace where Gateway and HTTPRoute resources are created
                      default: transfergw
                    generateGateway:
                      type: boolean
                      description: Auto-create Gateway resource if not exists
                      default: true
                    validationMode:
                      type: string
                      enum: ["strict", "permissive", "disabled"]
                      default: strict
                rollout:
                  type: object
                  description: Gradual rollout strategy
                  required:
                    - mode
                  properties:
                    mode:
                      type: string
                      enum: ["immediate", "gradual", "canary"]
                      default: canary
                    paused:
                      type: boolean
                      default: false
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Analyzing", "Converting", "Deploying", "Canary", "Complete", "Failed"]
                completionPercentage:
                  type: integer
                  minimum: 0
                  maximum: 100
                trafficRouting:
                  type: object
                  properties:
                    ingress:
                      type: integer
                    gateway:
                      type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Progress
          type: integer
          jsonPath: .status.completionPercentage
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
{{- end }}
