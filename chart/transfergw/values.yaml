namespace: transfergw
createNamespace: true

image:
  repository: thev1ndu/transfergw
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

logLevel: info

# enableWebhooks turns on the TransferGW validating webhook (rejects an
# unknown gatewayClass, a gatewayName already owned by another TransferGW,
# or warns on an empty selector). It only actually takes effect once
# webhookCABundle is also set - without a real cert, the webhook server has
# nothing to serve TLS with, and every TransferGW apply would fail closed.
# Provide your own cert (cert-manager, or a manually issued one) and set
# webhookCABundle to its base64 CA certificate; this chart does not
# provision one for you.
enableWebhooks: true
webhookCABundle: ""

# Cluster-wide default alerting webhook, notified on a health rollback for
# any TransferGW that leaves spec.monitoring.alerting unset. A TransferGW
# that sets its own alerting config always overrides this.
alerting:
  enabled: false
  webhookUrl: ""

metricsBindAddress: ":8080"
healthProbeBindAddress: ":8081"
webhookPort: 9443

service:
  type: ClusterIP
  metricsPort: 8080
  webhookPort: 443

leaderElection:
  enabled: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - transfergw-controller
          topologyKey: kubernetes.io/hostname

terminationGracePeriodSeconds: 30

livenessProbe:
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10

rbac:
  create: true

serviceAccount:
  create: true
  name: transfergw-controller

crd:
  install: true
